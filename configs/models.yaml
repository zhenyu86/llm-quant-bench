# 主要参数文件。model_a、model_b 只是便于理解的名称，可以自由修改。
# 命令中的 --model 后面填写这里定义的名称。
models:
  model_a:
    provider: sglang                     # sglang / vllm / deepseek / openai_compatible
    base_url: http://127.0.0.1:30000/v1  # 模型 A 的 OpenAI 兼容服务地址
    model: YOUR_MODEL_A                  # 服务实际暴露的模型名，需替换
    api_key_env: null                    # 密钥环境变量名；本地无鉴权可为 null
    base_model: null                     # 可选的模型家族信息，只用于记录
    variant: model_a                     # 可选版本说明，例如 instruct、fp16、int8
    hardware: unknown                    # 建议填写，例如 NVIDIA_H20_x1
    server_parameters: {}                # 用于记录实验条件，不会自动启动服务
    # extra_body:                        # 可选：服务专有请求参数
    #   ignore_eos: true

  model_b:
    provider: vllm
    base_url: http://127.0.0.1:8000/v1
    model: YOUR_MODEL_B
    api_key_env: null
    base_model: null
    variant: model_b
    hardware: unknown
    server_parameters: {}

  remote_model:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: YOUR_REMOTE_MODEL
    api_key_env: DEEPSEEK_API_KEY
    base_model: null
    variant: remote
    hardware: unknown
    server_parameters: {}

# 效果评测参数：决定测试题的回答方式。
quality:
  dataset_hub: modelscope
  dataset_dir: data/evalscope
  output_budget: 1024         # 每道题最多生成多少 token
  temperature: 0              # 建议保持 0，便于重复和比较
  timeout_seconds: 120        # 每个请求的超时时间
  concurrency: 1              # 同时发送的能力测试请求数
  thinking_mode: "off"        # "default" / "on" / "off"
  retries: 0                  # 失败后的重试次数

# 性能评测参数：决定请求压力和重复次数。
performance:
  mode: api                   # api：固定文本；fixed_tokens：固定 token 长度
  # concurrency 是“同一时刻最多在处理几个请求”，不是总请求数。
  concurrency: [1, 4, 8]      # 分别测并发 1、4、8，三个场景依次运行
  requests_per_round: 128     # 每个并发场景、每一轮累计发送 128 个正式请求
  rounds: 3                   # 每个并发场景重复 3 轮，用来观察波动
  warmup_requests: 4          # 每个并发场景每轮先发 4 个预热请求，不计入指标
  # 单模型正式请求总数 = 并发场景数 × requests_per_round × rounds
  # 当前示例：3 × 128 × 3 = 1152 个正式请求；另有 3 × 4 × 3 = 36 个预热请求
  output_budget: 256          # 每个请求最多生成多少 token
  timeout_seconds: 120
  temperature: 0
  thinking_mode: "off"

  # fixed_tokens 仅支持适配的本地 SGLang/vLLM 服务：
  # tokenizer_path: /path/to/tokenizer
  # input_tokens: 1024
  # output_tokens: 256
