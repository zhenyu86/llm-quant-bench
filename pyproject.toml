[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quant-bench"
version = "1.0.0"
description = "OpenAI-compatible LLM quality and service performance benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["evalscope[perf]==1.12.0", "PyYAML==6.0.3", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
